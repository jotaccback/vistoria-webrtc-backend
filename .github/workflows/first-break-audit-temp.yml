name: Temporary first-break tennis audit

on:
  push:
    paths:
      - '.github/workflows/first-break-audit-temp.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Compute first effective break to match-win rate
        shell: bash
        run: |
          python - <<'PY'
          import csv, io, urllib.request
          from collections import defaultdict

          URLS = {
              'ATP': [
                  'https://raw.githubusercontent.com/ppaulojr/tennis_pointbypoint/master/pbp_matches_atp_main_archive.csv',
                  'https://raw.githubusercontent.com/ppaulojr/tennis_pointbypoint/master/pbp_matches_atp_main_current.csv',
              ],
              'WTA': [
                  'https://raw.githubusercontent.com/ppaulojr/tennis_pointbypoint/master/pbp_matches_wta_main_archive.csv',
                  'https://raw.githubusercontent.com/ppaulojr/tennis_pointbypoint/master/pbp_matches_wta_main_current.csv',
              ],
          }

          def point_winner(ch):
              if ch in ('S','A'): return 'S'
              if ch in ('R','D'): return 'R'
              return None

          def analyze_game(g):
              if not g or '/' in g:
                  return None
              pts=[point_winner(ch) for ch in g]
              pts=[p for p in pts if p]
              if len(pts)<4:
                  return None
              s=r=0
              for p in pts:
                  if p=='S': s+=1
                  else: r+=1
                  if max(s,r)>=4 and abs(s-r)>=2:
                      return 'S' if s>r else 'R'
              return None

          stats=defaultdict(lambda: dict(rows=0, with_break=0, fb_win=0, fb_loss=0, no_break=0, bad_before_first=0, bad_winner=0))
          seen=set()

          for tour, urls in URLS.items():
              for url in urls:
                  data=urllib.request.urlopen(url, timeout=120).read().decode('utf-8-sig', errors='replace')
                  for row in csv.DictReader(io.StringIO(data)):
                      # Singles only, mirroring the ALLSPORTS empirical PBP workflow.
                      if '/' in (row.get('server1') or '') or '/' in (row.get('server2') or ''):
                          continue
                      key=(tour,row.get('date'),row.get('tny_name'),row.get('server1'),row.get('server2'),row.get('winner'),row.get('score'),row.get('pbp'))
                      if key in seen:
                          continue
                      seen.add(key)
                      pbp=(row.get('pbp') or '').strip()
                      if not pbp:
                          continue
                      try:
                          match_winner=int(row.get('winner') or 0)
                      except Exception:
                          match_winner=0
                      if match_winner not in (1,2):
                          stats[tour]['bad_winner']+=1
                          continue

                      stats[tour]['rows']+=1
                      server=1  # server1 serves the first game by dataset definition
                      first_breaker=None
                      bad=False

                      for setstr in pbp.split('.'):
                          for g in setstr.split(';'):
                              g=g.strip()
                              if not g:
                                  continue
                              if '/' in g:
                                  # Tiebreak: not a service break. Treat as one game for next server.
                                  server = 2 if server==1 else 1
                                  continue
                              gw=analyze_game(g)
                              if gw is None:
                                  bad=True
                                  break
                              if gw=='R':
                                  first_breaker = 2 if server==1 else 1
                                  break
                              # Hold: next game is served by the other player.
                              server = 2 if server==1 else 1
                          if bad or first_breaker is not None:
                              break

                      if bad:
                          stats[tour]['bad_before_first']+=1
                          continue
                      if first_breaker is None:
                          stats[tour]['no_break']+=1
                          continue

                      stats[tour]['with_break']+=1
                      if first_breaker==match_winner:
                          stats[tour]['fb_win']+=1
                      else:
                          stats[tour]['fb_loss']+=1

          print('=== FIRST EFFECTIVE SERVICE BREAK -> MATCH WIN ===')
          total=defaultdict(int)
          for tour in ('ATP','WTA'):
              s=stats[tour]
              for k,v in s.items(): total[k]+=v
              pct=100*s['fb_win']/s['with_break'] if s['with_break'] else float('nan')
              print(f"{tour}: rows={s['rows']} analyzable_with_break={s['with_break']} first_breaker_won={s['fb_win']} first_breaker_lost={s['fb_loss']} win_rate={pct:.4f}% no_break={s['no_break']} invalid_before_first={s['bad_before_first']} bad_winner={s['bad_winner']}")
          pct=100*total['fb_win']/total['with_break'] if total['with_break'] else float('nan')
          print(f"COMBINED: rows={total['rows']} analyzable_with_break={total['with_break']} first_breaker_won={total['fb_win']} first_breaker_lost={total['fb_loss']} win_rate={pct:.4f}% no_break={total['no_break']} invalid_before_first={total['bad_before_first']} bad_winner={total['bad_winner']}")
          PY
